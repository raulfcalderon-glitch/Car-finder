<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,100..125,500..900;1,100..125,500..900&family=Inter:wght@400..700&display=block">
<style>
:root{--ink:#0d0e10;--paper:#f4f3f0;--red:#e2283f;--deep:#c8102e;--txt:#f2f1ee}
*{box-sizing:border-box}
body{margin:0;background:#e9e7e2;font-family:Inter,sans-serif;color:#15171a;width:1400px;padding:40px}
h1{font-family:Archivo;font-stretch:118%;font-weight:800;font-size:40px;margin:0 0 6px}
.sub{color:#5c6370;margin:0 0 28px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.c{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #dcd9d2}
.dark{background:var(--ink);color:var(--txt);height:170px;display:flex;align-items:center;justify-content:center;gap:14px}
.light{background:var(--paper);height:96px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid #e2dfd8}
.dark svg{width:66px;height:66px}.light svg{width:44px;height:44px}
.wm{font-family:Archivo;font-stretch:118%;font-weight:800;font-size:34px;letter-spacing:-.01em}
.light .wm{font-size:24px;color:#15171a}
.wm em{font-style:normal;color:var(--red)}
.light .wm em{color:var(--deep)}
.meta{padding:14px 18px}
.meta b{font-family:Archivo;font-stretch:112%;font-size:18px}
.meta p{margin:6px 0 0;color:#5c6370;font-size:14px;line-height:1.45}
.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--deep);color:#fff;font-weight:700;font-size:13px;margin-right:8px;vertical-align:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#1e7a3c;border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:3px}
.italic{font-style:italic}
</style></head><body>
<h1>CarsFindMe — logo concepts</h1>
<p class="sub">Each shown on the dark header and on light paper. Brand red and ink kept from the current site.</p>
<div class="grid" id="g"></div>
<script>
const W = (c) => c; // svg uses currentColor for the "ink/white" parts
const marks = [
 {t:'Steering wheel', tag:'current', d:'The mark on the site today: a three-spoke wheel with a red hub. Simple and recognizable, but reads as "driving", not "finding".',
  svg:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="19" fill="none" stroke="currentColor" stroke-width="5"/><path d="M13 32h14M37 32h14M32 37v14" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="5.5" fill="#e2283f"/></svg>`},
 {t:'Wheel-lens magnifier', d:'A magnifying glass whose lens is a five-spoke alloy wheel. Says "search" and "cars" in one shape, and works tiny as an app icon.',
  svg:`<svg viewBox="0 0 64 64"><circle cx="27" cy="27" r="17" fill="none" stroke="currentColor" stroke-width="5"/><g stroke="#e2283f" stroke-width="3.2" stroke-linecap="round">${[0,72,144,216,288].map(a=>{const r=a*Math.PI/180;return `<line x1="${27+4*Math.sin(r)}" y1="${27-4*Math.cos(r)}" x2="${27+12*Math.sin(r)}" y2="${27-12*Math.cos(r)}"/>`}).join('')}</g><circle cx="27" cy="27" r="3.6" fill="currentColor"/><path d="M40 40l14 14" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>`},
 {t:'Pin + wheel', d:'A map pin with a wheel inside: "your car, located". Familiar from maps apps, so the meaning is instant.',
  svg:`<svg viewBox="0 0 64 64"><path d="M32 59C32 59 12 38 12 25a20 20 0 0 1 40 0c0 13-20 34-20 34z" fill="#e2283f"/><circle cx="32" cy="25" r="11" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M21 25h7M36 25h7M32 28v8" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="32" cy="25" r="3" fill="#fff"/></svg>`},
 {t:'Round headlight', d:'A classic round headlamp (think 911, E-Type, Defender) drawn like a target. Enthusiasts will feel it; others just see a clean emblem.',
  svg:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="none" stroke="currentColor" stroke-width="4.5"/><circle cx="32" cy="32" r="17" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/><path d="M15 32h34M32 15v34" stroke="currentColor" stroke-width="1.6" opacity=".4"/><circle cx="32" cy="32" r="8" fill="#e2283f"/><path d="M22 20a15 15 0 0 1 10-4" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`},
 {t:'Vintage race roundel', d:'The white circle racers paint their number in, with "CF" as the number. Pure enthusiast culture, period-correct and ownable.',
  svg:`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="#f2f1ee"/><circle cx="32" cy="32" r="27" fill="none" stroke="#e2283f" stroke-width="4"/><text x="32" y="42" text-anchor="middle" font-family="Archivo" font-stretch="112%" font-weight="900" font-size="27" fill="#0d0e10">CF</text></svg>`},
 {t:'Enamel crest', d:'A shield like a classic marque badge, with a "CFM" monogram and a red stripe. Feels heritage and premium; best for merch and stickers.',
  svg:`<svg viewBox="0 0 64 64"><path d="M32 5l22 7v18c0 15-10 24-22 29C20 54 10 45 10 30V12z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M14 22h36v8H14z" fill="#e2283f"/><text x="32" y="45" text-anchor="middle" font-family="Archivo" font-stretch="100%" font-weight="900" font-size="11.5" fill="currentColor">CFM</text></svg>`},
 {t:'H-gate shifter', d:'A manual gear pattern whose final gate ends in a red dot: "you\'ve arrived". A wink to the stick-shift crowd.',
  svg:`<svg viewBox="0 0 64 64"><g stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"><path d="M14 12v40M32 12v40M50 12v20"/><path d="M14 32h36"/></g><circle cx="50" cy="50" r="7" fill="#e2283f"/><circle cx="14" cy="12" r="3.5" fill="currentColor"/></svg>`},
 {t:'Tachometer needle', d:'A rev gauge with the needle swinging into the red: the thrill of finding the one. Strong at large sizes, simpler as an icon.',
  svg:`<svg viewBox="0 0 64 64"><path d="M10 44a24 24 0 1 1 44 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M44 18a24 24 0 0 1 10 26" fill="none" stroke="#e2283f" stroke-width="5" stroke-linecap="round"/><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 32h5M18 19l3.5 3.5M32 13v5"/></g><path d="M32 40L47 23" stroke="#e2283f" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="40" r="5" fill="currentColor"/></svg>`},
 {t:'Speed-line wordmark', italic:true, d:'No symbol: a slanted wordmark with motion lines. Clean and fast; the "F" alone can be the icon.',
  svg:`<svg viewBox="0 0 64 64"><g transform="skewX(-12)"><rect x="18" y="12" width="9" height="40" rx="2" fill="currentColor"/><rect x="18" y="12" width="30" height="9" rx="2" fill="currentColor"/><rect x="18" y="28" width="22" height="8" rx="2" fill="#e2283f"/></g><g stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"><path d="M2 42h10M4 50h8"/></g></svg>`},
];
document.getElementById('g').innerHTML = marks.map((m,i)=>`
 <div class="c">
  <div class="dark">${m.svg}<span class="wm ${m.italic?'italic':''}">Cars<em>Find</em>Me</span></div>
  <div class="light" style="color:#15171a">${m.svg}<span class="wm ${m.italic?'italic':''}">Cars<em>Find</em>Me</span></div>
  <div class="meta"><b><span class="n">${i+1}</span>${m.t}</b>${m.tag?`<span class="tag">${m.tag}</span>`:''}<p>${m.d}</p></div>
 </div>`).join('');
</script></body></html>
