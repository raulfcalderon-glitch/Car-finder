<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800&family=Archivo:ital,wdth,wght@0,100..125,700..900;1,100..125,700..900&family=Inter:wght@400..700&display=block">
<style>
body{margin:0;background:#dedbd4;font-family:Inter,sans-serif;color:#15171a;width:1500px;padding:44px;box-sizing:border-box}
h1{font-family:Archivo;font-stretch:118%;font-weight:800;font-size:40px;margin:0 0 6px}
.sub{color:#5c6370;margin:0 0 26px;font-size:17px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.card{background:#fff;border-radius:18px;overflow:hidden}
.stage{background:#000;height:330px;display:grid;place-items:center}
.stage.light{background:#f4f2ee}
.stage svg{width:92%;height:auto}
.stage img{height:330px}
.meta{padding:14px 20px 18px}.meta b{font-family:Archivo;font-stretch:112%;font-size:19px}
.meta p,.meta li{color:#5c6370;font-size:14.5px;line-height:1.5;margin:6px 0 0}
.meta ul{margin:6px 0 0;padding-left:18px}
.small{display:flex;gap:24px;align-items:center;justify-content:center;background:#0b0c0e;padding:22px}
.small .hdr{display:flex;align-items:center;gap:12px;background:#0d0e10;border:1px solid #2a2d31;border-radius:10px;padding:10px 16px}
.small svg{height:34px;width:auto}
.icons{display:flex;gap:18px;align-items:end}
.icons svg{display:block}
</style></head><body>
<h1>Your car logo, refined</h1>
<p class="sub">Same idea (a sports-car line over the name), redrawn so every line is deliberate.</p>
<div id="out"></div>
<script>
const R = '#e2283f';
// The car: a low mid-engine coupe. u runs tail (0) → nose (1); h is height above the sill (0–1).
function carPaths({ x0, W, sill, H, wheels, sw, fg, variant }) {
  const X = (u) => x0 + u * W, Y = (h) => sill - h * H;
  const roof = `M ${X(0)} ${Y(.40)}
    C ${X(.08)} ${Y(.44)}, ${X(.16)} ${Y(.50)}, ${X(.24)} ${Y(.62)}
    C ${X(.33)} ${Y(.80)}, ${X(.41)} ${Y(1)}, ${X(.50)} ${Y(1)}
    C ${X(.56)} ${Y(1)}, ${X(.60)} ${Y(.86)}, ${X(.65)} ${Y(.58)}
    C ${X(.75)} ${Y(.48)}, ${X(.90)} ${Y(.34)}, ${X(.985)} ${Y(.16)}
    C ${X(1.0)} ${Y(.10)}, ${X(.995)} ${Y(.02)}, ${X(.97)} ${Y(0)}`;
  const spoiler = `M ${X(-.025)} ${Y(.52)} L ${X(.02)} ${Y(.42)}`;
  const tail = `M ${X(0)} ${Y(.40)} C ${X(-.012)} ${Y(.28)}, ${X(-.006)} ${Y(.08)}, ${X(.02)} ${Y(0)}`;
  let sillD = `M ${X(.02)} ${sill}`;
  for (const w of wheels) { const half = Math.sqrt(w.r * w.r - (w.cy - sill) ** 2); sillD += ` H ${w.cx - half} A ${w.r} ${w.r} 0 0 1 ${w.cx + half} ${sill}`; }
  sillD += ` H ${X(.97)}`;
  const win = `M ${X(.30)} ${Y(.60)} C ${X(.37)} ${Y(.80)}, ${X(.45)} ${Y(.90)}, ${X(.51)} ${Y(.90)} C ${X(.55)} ${Y(.90)}, ${X(.58)} ${Y(.78)}, ${X(.605)} ${Y(.60)} C ${X(.5)} ${Y(.57)}, ${X(.4)} ${Y(.57)}, ${X(.30)} ${Y(.60)} Z`;
  const stroke = (d, w = sw, c = fg) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (variant === 'line') return stroke(roof) + stroke(spoiler) + stroke(`M ${X(.0)} ${Y(.26)} h ${W * .045}`, sw, R);
  return stroke(roof) + stroke(spoiler) + stroke(tail) + stroke(sillD) + stroke(win, sw * .55)
    + stroke(`M ${X(.008)} ${Y(.24)} L ${X(.05)} ${Y(.25)}`, sw, R)
    + stroke(`M ${X(.90)} ${Y(.27)} L ${X(.955)} ${Y(.2)}`, sw * .8, R);
}
// Car over the wordmark; the rear wheel arch sits over the "C" and the front one over the "D".
function carLogo({ font, weight, size = 150, spacing = 0, italic = false, fg = '#fff', variant = 'full' }) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 2000 700');
  const text = document.createElementNS(ns, 'text');
  text.setAttribute('x', 200); text.setAttribute('y', 560);
  text.setAttribute('font-family', font); text.setAttribute('font-weight', weight); text.setAttribute('font-size', size);
  text.setAttribute('letter-spacing', spacing); if (italic) text.setAttribute('font-style', 'italic');
  if (font === 'Archivo') text.setAttribute('font-stretch', '118%');
  text.setAttribute('fill', fg);
  text.innerHTML = `CARS<tspan fill="${R}">FIND</tspan>ME`;
  svg.appendChild(text); document.body.appendChild(svg);
  const box = text.getBBox();
  const pos = (i) => [text.getStartPositionOfChar(i).x, text.getEndPositionOfChar(i).x];
  const capTop = 560 - size * 0.70, mid = 560 - size * 0.35, sill = capTop - 20;
  const wheel = ([a, b]) => ({ cx: (a + b) / 2 + (italic ? 10 : 0), cy: mid, r: (mid - sill) + size * .26 });
  const x0 = box.x - size * .55, W = box.width + size * .8;
  const g = document.createElementNS(ns, 'g');
  g.innerHTML = carPaths({ x0, W, sill, H: size * 1.25, wheels: [wheel(pos(0)), wheel(pos(7))], sw: size * .07, fg, variant });
  svg.insertBefore(g, text);
  const a = g.getBBox(), b = text.getBBox();
  const minX = Math.min(a.x, b.x), minY = Math.min(a.y, b.y), maxX = Math.max(a.x + a.width, b.x + b.width), maxY = Math.max(a.y + a.height, b.y + b.height);
  svg.setAttribute('viewBox', `${minX - 30} ${minY - 30} ${maxX - minX + 60} ${maxY - minY + 60}`);
  svg.remove();
  return svg.outerHTML;
}
// Square icon: the same car, short and tall enough to read, with round wheels.
function icon(size, bg, fg) {
  const wheels = [{ cx: 30, cy: 66, r: 13.5 }, { cx: 75, cy: 66, r: 13.5 }];
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="${bg}"/>
  ${carPaths({ x0: 8, W: 86, sill: 62, H: 34, wheels, sw: 4.4, fg, variant: 'full' })}
  <circle cx="30" cy="66" r="8" fill="none" stroke="${fg}" stroke-width="4.4"/><circle cx="75" cy="66" r="8" fill="none" stroke="${R}" stroke-width="4.4"/></svg>`;
}
Promise.all(['800 150px "League Spartan"', '800 140px Archivo', 'italic 900 140px Archivo'].map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(() => {
  const A = (fg) => carLogo({ font: 'League Spartan', weight: 800, size: 150, spacing: 2, fg });
  const B = (fg) => carLogo({ font: 'Archivo', weight: 800, size: 140, spacing: -2, fg });
  const Cc = (fg) => carLogo({ font: 'Archivo', weight: 900, size: 140, spacing: -3, italic: true, fg, variant: 'line' });
  document.getElementById('out').innerHTML = `
  <div class="row">
    <div class="card"><div class="stage"><img src="original-car-logo.png"></div><div class="meta"><b>Yours (today)</b>
      <ul><li>Lines vary in thickness and some ends are blunt, so the car looks traced rather than drawn.</li>
      <li>The wheel arches float: one clips the "C", the other lands between letters, and the sill line stops short.</li>
      <li>Similar stock car outlines are common in logo templates, which makes it less ownable.</li>
      <li>At small sizes (site header, browser tab) the thin details disappear.</li></ul></div></div>
    <div class="card"><div class="stage">${A('#fff')}</div><div class="meta"><b>A. Refined (closest to yours)</b>
      <p>Same layout and geometric type. One consistent line weight; the rear arch sits exactly over the "C" and the front arch over the "D", so those letters become the wheels. Red taillight and headlight kept as small accents.</p></div></div>
  </div>
  <div class="row">
    <div class="card"><div class="stage">${B('#fff')}</div><div class="meta"><b>B. Matched to the site</b>
      <p>The same car in the wide, heavy typeface the website already uses, so the logo, headings and buttons all feel like one brand.</p></div></div>
    <div class="card"><div class="stage">${Cc('#fff')}</div><div class="meta"><b>C. Minimal flyline</b>
      <p>Only the roofline and a red taillight, over an italic wordmark. The most "designed" and premium of the three; the single line still says "sports car".</p></div></div>
  </div>
  <div class="row">
    <div class="card"><div class="stage light">${A('#111')}</div><div class="meta"><b>A on light backgrounds</b><p>Works in black for letterheads, invoices and white web pages.</p></div></div>
    <div class="card"><div class="stage light" style="gap:22px;display:flex;align-items:center;justify-content:center"><div class="icons">${icon(150,'#0b0c0e','#f4f2ee')}${icon(150,R,'#fff')}${icon(64,'#0b0c0e','#f4f2ee')}${icon(32,'#0b0c0e','#f4f2ee')}</div></div>
      <div class="meta"><b>App icon / browser tab</b><p>A wide logo can't fit a square, so the icon is the same car, shortened, with the front wheel in red. Shown at app-icon, phone and browser-tab sizes.</p></div></div>
  </div>
  <div class="card"><div class="small">
    <div class="hdr">${A('#fff')}</div><div class="hdr">${B('#fff')}</div><div class="hdr">${Cc('#fff')}</div>
  </div><div class="meta"><b>Real size in the site header</b><p>How each reads at the height it'll actually be used, top-left of every page.</p></div></div>`;
});
</script></body></html>
